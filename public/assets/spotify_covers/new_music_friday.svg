      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#nmfBg)"/>
  
  <!-- Stylized Studio Portrait -->
