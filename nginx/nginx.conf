# ====================================================================
# SongBuddy Production Nginx Reverse Proxy Configuration
# ====================================================================

upstream songbuddy_backend {
    server songbuddy:8000;
    keepalive 32;
}

# Rate limiting zone (15 requests/second per IP with burst allowance)
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=15r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Client upload and header buffers
    client_max_body_size 10M;

    # Gzip Compression for static code assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Direct audio streaming proxy (Byte-Range support, unbuffered)
    location /api/stream {
        proxy_pass http://songbuddy_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # API endpoints with rate limiting
    location /api/ {
        limit_req zone=api_zone burst=25 nodelay;
        limit_req_status 429;

        proxy_pass http://songbuddy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets with caching
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
        proxy_pass http://songbuddy_backend;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Web application frontend root
    location / {
        proxy_pass http://songbuddy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
