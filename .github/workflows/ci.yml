name: SongBuddy CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test & Quality Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system FFmpeg dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run code linting & syntax checks
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,downloads
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=130 --statistics --exclude=.venv,downloads

      - name: Execute automated pytest suite
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-cd-testing-secret-key-that-is-secure-and-long!
          REQUIRE_AUTH: "false"
        run: |
          pytest --cov=. --cov-report=term-missing

  docker-build:
    name: Docker Containerization Build & Health Verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: songbuddy:ci-test
          load: true

      - name: Run Container & Verify Healthcheck
        run: |
          docker run -d --name songbuddy-test -p 8000:8000 songbuddy:ci-test
          sleep 12
          docker inspect --format='{{json .State.Health.Status}}' songbuddy-test | grep -q "healthy" || {
            echo "Container healthcheck failed"
            docker logs songbuddy-test
            exit 1
          }
          curl -f http://127.0.0.1:8000/api/health
          docker stop songbuddy-test
